<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  {{ css_block }}
  {{ mathjax_config }}
  {{ mathjax_script }}
</head>
<body class="{{ theme_class }} {{ scroll_class }}">
  <header class="book-header">
    <div class="book-kicker">Kirei TeX prototype</div>
    <h1>{{ title }}</h1>
    <p class="book-subtitle">{{ subtitle }}</p>
    <div class="book-actions" aria-label="表示設定">
      <label class="advanced-toggle">
        <input id="advanced-toggle" type="checkbox">
        <span id="advanced-toggle-label">発展を表示</span>
      </label>
      <fieldset class="theme-switcher" aria-label="表示モード">
        <legend>表示</legend>
        <button type="button" data-theme-choice="rich">リッチ</button>
        <button type="button" data-theme-choice="mono">白黒</button>
      </fieldset>
      <fieldset class="scroll-switcher" aria-label="スクロールモード">
        <legend>読方向</legend>
        <button type="button" data-scroll-choice="vertical">縦</button>
        <button type="button" data-scroll-choice="horizontal">横</button>
      </fieldset>
    </div>
  </header>

  <main class="book-page">
{{ toc }}
{{ content }}
  </main>

  <footer class="book-footer">
    <p>Generated by <code>src/build.py</code> at {{ generated_at }}.</p>
  </footer>

  {{ js_block }}
</body>
</html>
