<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
{{ css }}
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"], ["$$", "$$"]],
        processEscapes: true
      },
      svg: {
        fontCache: "global"
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <header class="book-header">
    <div class="book-kicker">Kirei TeX prototype</div>
    <h1>{{ title }}</h1>
    <p class="book-subtitle">{{ subtitle }}</p>
    <div class="book-actions" aria-label="表示設定">
      <label class="advanced-toggle">
        <input id="advanced-toggle" type="checkbox">
        <span>発展を表示</span>
      </label>
    </div>
  </header>

  <main class="book-page">
{{ content }}
  </main>

  <footer class="book-footer">
    <p>Generated by <code>src/build.py</code> at {{ generated_at }}.</p>
  </footer>

  <script>
{{ js }}
  </script>
</body>
</html>
